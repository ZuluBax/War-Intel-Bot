[project]
name = "torn-war-intelligence"
version = "0.1.0"
description = "Discord bot that detects Torn City ranked wars, gathers opposition intelligence, and estimates enemy strength via FFScouter."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "discord.py>=2.5,<3.0",  # 2.5: application emoji (alert_emoji.py)
    "httpx>=0.27,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.20",          # async SQLite driver for local/dev
    "asyncpg>=0.29",            # async PostgreSQL driver for production
    "alembic>=1.13",            # schema migrations
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "python-dotenv>=1.0",
    "APScheduler>=3.10,<4.0",
    "structlog>=24.1",
    "cryptography>=42.0",       # Fernet: encrypts per-guild API keys at rest
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
torn-war-intel = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.lint.per-file-ignores]
# tests: allow hardcoded fake secrets, non-crypto random, and long fixture lines
"tests/**" = ["S105", "S106", "S311", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    # discord.py 2.x imports the stdlib `audioop` module (removed in 3.13);
    # not our code and nothing we can fix — don't fail collection on it.
    "ignore:'audioop' is deprecated:DeprecationWarning",
    "default::DeprecationWarning:discord",
]
